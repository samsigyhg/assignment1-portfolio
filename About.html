<script>

  function updateDetailKoreaDateTime() {

    const now = new Date();

    const koreaDate =
      new Intl.DateTimeFormat(
        "en-US",
        {
          timeZone: "Asia/Seoul",
          weekday: "short",
          month: "short",
          day: "numeric"
        }
      ).format(now);


    const koreaTime =
      new Intl.DateTimeFormat(
        "en-US",
        {
          timeZone: "Asia/Seoul",
          hour: "numeric",
          minute: "2-digit",
          hour12: true
        }
      ).format(now);


    const dateElement =
      document.getElementById(
        "detail-korea-date"
      );

    const clockElement =
      document.getElementById(
        "detail-korea-clock"
      );


    if (dateElement) {
      dateElement.textContent =
        koreaDate;
    }


    if (clockElement) {
      clockElement.textContent =
        koreaTime;
    }

  }


  updateDetailKoreaDateTime();

  setInterval(
    updateDetailKoreaDateTime,
    30000
  );

</script>

/* ==========================================
   클릭한 창을 맨 앞으로 가져오기
   ========================================== */

function bringAboutWindowToFront(
  windowElement
) {

  highestWindowZ++;

  windowElement.style.zIndex =
    highestWindowZ;

}


/* ==========================================
   팝업 만들기
   ========================================== */

function createAboutWindow(
  panelName
) {

  const data =
    aboutData[panelName];


  if (!data) {
    return;
  }


  /*
    같은 팝업이 이미 열려 있으면
    하나 더 만들지 않고 앞으로 가져옴
  */
  const existingWindow =
    document.querySelector(
      `.about-window[data-window="${panelName}"]`
    );


  if (existingWindow) {

    bringAboutWindowToFront(
      existingWindow
    );

    return;
  }


  const newWindow =
    document.createElement(
      "div"
    );


  newWindow.className =
    "about-window";


  newWindow.dataset.window =
    panelName;


  /*
    여러 창이 완전히 같은 자리에
    겹치지 않도록 조금씩 이동
  */
  const offset =
    openedWindowCount % 5;


  newWindow.style.left =
    `${155 + offset * 34}px`;


  newWindow.style.top =
    `${85 + offset * 27}px`;


  openedWindowCount++;


  newWindow.innerHTML = `

    <div class="about-window-bar">

      <div class="window-controls">

       <button
  class="window-control window-close"
  aria-label="Close">
  <span class="close-x">×</span>
</button>

       <button
  type="button"
  class="window-control window-minimize"
  aria-label="Minimize">
</button>
       <button
  type="button"
  class="window-control window-maximize"
  aria-label="Maximize">
</button>

      </div>


      <span class="window-title">
        ${data.title}
      </span>

    </div>


    <div class="about-window-content">

      <h2>
        ${data.title}
      </h2>

      <p class="window-description">
        ${data.description}
      </p>


      ${data.items.map(

        item => `

          <div class="window-item">

            <span>
              ${item[0]}
            </span>

            <h3>
              ${item[1]}
            </h3>

            <p>
              ${item[2]}
            </p>

          </div>

        `

      ).join("")}

    </div>

  `;


  aboutWindowLayer.appendChild(
    newWindow
  );


  bringAboutWindowToFront(
    newWindow
  );


  /* 창 클릭 → 맨 앞으로 */
  newWindow.addEventListener(
    "pointerdown",
    function() {

      bringAboutWindowToFront(
        newWindow
      );

    }
  );


  /* 빨간색 X */
  const closeButton =
  newWindow.querySelector(
    ".window-close"
  );


closeButton.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();


    /*
      닫히는 애니메이션 시작
    */
    newWindow.classList.add(
      "closing"
    );


    /*
      애니메이션이 끝난 뒤
      실제 HTML에서 제거
    */
    setTimeout(
      function() {

        newWindow.remove();

      },
      280
    );

  }
);

  makeAboutWindowDraggable(
    newWindow
  );
/* ==========================================
   MINIMIZE
   ========================================== */

const minimizeButton =
  newWindow.querySelector(
    ".window-minimize"
  );


minimizeButton.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();


    newWindow.classList.toggle(
      "minimized"
    );


    bringAboutWindowToFront(
      newWindow
    );

  }
);
/* ==========================================
   MAXIMIZE / RESTORE
   ========================================== */



const maximizeButton =
  newWindow.querySelector(
    ".window-maximize"
  );


maximizeButton.addEventListener(
  "click",
  function(event) {

    event.stopPropagation();


    /* 이미 최대화 상태라면 원래 위치로 복구 */
    if (
      newWindow.classList.contains(
        "maximized"
      )
    ) {

      newWindow.classList.remove(
        "maximized"
      );


      newWindow.style.left =
        newWindow.dataset.oldLeft;

      newWindow.style.top =
        newWindow.dataset.oldTop;

      newWindow.style.width =
        newWindow.dataset.oldWidth;

      newWindow.style.height =
        newWindow.dataset.oldHeight;


      return;

    }


    /*
      최소화 상태라면
      먼저 다시 펼침
    */
    newWindow.classList.remove(
      "minimized"
    );


    /*
      현재 위치 / 크기를 기억
    */
    newWindow.dataset.oldLeft =
      newWindow.style.left;

    newWindow.dataset.oldTop =
      newWindow.style.top;

    newWindow.dataset.oldWidth =
      `${newWindow.offsetWidth}px`;

    newWindow.dataset.oldHeight =
      `${newWindow.offsetHeight}px`;


    /*
      최대화
    */
    newWindow.classList.add(
      "maximized"
    );


    newWindow.style.left =
      "16px";

    newWindow.style.top =
      "16px";

    newWindow.style.width =
      "calc(100% - 32px)";

    newWindow.style.height =
      "calc(100% - 32px)";


    bringAboutWindowToFront(
      newWindow
    );

  }
);
}


/* ==========================================
   WINDOW DRAG
   ========================================== */

function makeAboutWindowDraggable(
  windowElement
) {

  const windowBar =
    windowElement.querySelector(
      ".about-window-bar"
    );


  let dragging = false;

  let startX = 0;
  let startY = 0;

  let startLeft = 0;
  let startTop = 0;


  windowBar.addEventListener(
    "pointerdown",
    function(event) {


      /*
        X 버튼에서는
        드래그 시작 안 함
      */
      if (
  event.target.closest(
    ".window-control"
  )
) {
  return;
}

      dragging = true;


      bringAboutWindowToFront(
        windowElement
      );


      windowElement.classList.add(
        "dragging"
      );


      startX =
        event.clientX;

      startY =
        event.clientY;


      startLeft =
        windowElement.offsetLeft;

      startTop =
        windowElement.offsetTop;


      windowBar.setPointerCapture(
        event.pointerId
      );

    }
  );


  windowBar.addEventListener(
  "pointermove",
  function(event) {

    if (!dragging) {
      return;
    }


    const moveX =
      event.clientX -
      startX;

    const moveY =
      event.clientY -
      startY;


    let newLeft =
      startLeft + moveX;

    let newTop =
      startTop + moveY;


    const layerWidth =
      aboutWindowLayer.clientWidth;

    const layerHeight =
      aboutWindowLayer.clientHeight;


    const windowWidth =
      windowElement.offsetWidth;

    const windowHeight =
      windowElement.offsetHeight;


    /*
      Mac 느낌:
      창 대부분은 화면 밖으로 나가도 되지만
      title bar를 다시 잡을 수 있을 만큼은
      항상 남겨둔다.
    */

    const visibleSide = 90;

    const titleBarHeight = 36;

    const bottomVisible = 50;


    /*
      왼쪽 제한
      창이 왼쪽으로 나가도
      오른쪽 일부는 반드시 남김
    */
    const minLeft =
      -windowWidth +
      visibleSide;


    /*
      오른쪽 제한
      창이 오른쪽으로 나가도
      왼쪽 일부는 반드시 남김
    */
    const maxLeft =
      layerWidth -
      visibleSide;


    /*
      위쪽 제한
      title bar는 절대 위로 사라지지 않게
    */
    const minTop = 0;


    /*
      아래쪽 제한
      창이 아래로 내려가도
      title bar + 일부는 다시 잡을 수 있게
    */
    const maxTop =
      layerHeight -
      titleBarHeight -
      bottomVisible;


    newLeft =
      Math.max(
        minLeft,
        Math.min(
          newLeft,
          maxLeft
        )
      );


    newTop =
      Math.max(
        minTop,
        Math.min(
          newTop,
          maxTop
        )
      );


    windowElement.style.left =
      `${newLeft}px`;

    windowElement.style.top =
      `${newTop}px`;

  }
);

  windowBar.addEventListener(
    "pointerup",
    function() {

      dragging = false;

      windowElement.classList.remove(
        "dragging"
      );

    }
  );


  windowBar.addEventListener(
    "pointercancel",
    function() {

      dragging = false;

      windowElement.classList.remove(
        "dragging"
      );

    }
  );

}


/* ==========================================
   RIGHT ICON CLICK
   ========================================== */

aboutAppButtons.forEach(
  function(button) {

    button.addEventListener(
      "click",
      function() {

        createAboutWindow(
          button.dataset.panel
        );

      }
    );

  }
);

</script>
