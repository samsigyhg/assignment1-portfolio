<script>
function updateKoreaDateTime() {

  const now = new Date();

  const koreaDate =
    new Intl.DateTimeFormat("en-US", {
      timeZone: "Asia/Seoul",
      weekday: "short",
      month: "short",
      day: "numeric"
    }).format(now);

  const koreaTime =
    new Intl.DateTimeFormat("en-US", {
      timeZone: "Asia/Seoul",
      hour: "numeric",
      minute: "2-digit",
      hour12: true
    }).format(now);

  document.getElementById("korea-date").textContent =
    koreaDate;

  document.getElementById("korea-clock").textContent =
    koreaTime;
}

updateKoreaDateTime();

setInterval(
  updateKoreaDateTime,
  30000
);
</script>
