<script>
  function updateKoreaDateTime() {

    const now = new Date();

    const koreaDate =
      new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Seoul",
        weekday: "short",
        month: "short",
        day: "numeric"
      }).format(now);

    const koreaTime =
      new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Seoul",
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      }).format(now);

    const dateElement =
      document.getElementById("korea-date");

    const clockElement =
      document.getElementById("korea-clock");

    if (dateElement) {
      dateElement.textContent =
        koreaDate;
    }

    if (clockElement) {
      clockElement.textContent =
        koreaTime;
    }
  }

  updateKoreaDateTime();

  setInterval(
    updateKoreaDateTime,
    30000
  );
</script>
<script>
  const futureGoals = {

    "2027": {

      period:
        "2027 · GRADUATION",

      title:
        "Graduate & Begin",

      content: `
        <p>
          대학 졸업 후에는 지금까지 배운 전공 지식과
          대학생활에서 쌓은 경험을 바탕으로
          제가 관심 있는 분야에서 첫걸음을 시작하고 싶습니다.
        </p>

        <p>
          졸업 자체를 끝이라고 생각하기보다,
          앞으로 어떤 분야에서 성장할 수 있을지
          직접 경험하며 방향을 찾고 싶습니다.
        </p>
      `

    },


    "2028-2030": {

      period:
        "2028–2030 · CAREER",

      title:
        "Build My Career",

      content: `
        <p>
          제가 좋아하는 분야와 잘할 수 있는 분야가
          만나는 일을 찾고, 실제 업무 경험을 통해
          저만의 전문성을 만들어 가고 싶습니다.
        </p>

        <p>
          프로젝트와 실무 경험을 꾸준히 쌓으면서
          하나의 분야에서 신뢰받을 수 있는 사람이 되는 것이 목표입니다.
        </p>
      `

    },


    "2030+": {

      period:
        "2030+ · EXPERIENCE",

      title:
        "See More, Experience More",

      content: `
        <p>
          한 곳에만 머무르지 않고 새로운 환경과
          사람들을 계속 만나면서 시야를 넓히고 싶습니다.
        </p>

        <p>
          졸업 후 해외에서 일하면서 다양한 문화와 사회를 접해보고 싶습니다. 특히 스페인어권이나 영어권에서 일해보고 싶은데, 
          그 이유는 스페인어와 영어를 잘하지는 않지만 그 쪽 문화 사람들과 이야기 하는 것을 좋아하고, 양쪽 언어의 시장이 우리
          나라와 비교도 무색할만큼 크기 때문입니다.
        </p>
      `

    },


    "long-term": {

      period:
        "LONG TERM · MY VISION",

      title:
        "Keep Growing",

      content: `
        <p>
          장기적으로는 제가 좋아하는 일을 꾸준히 이어가면서
          동시에 새로운 것을 배우는 사람으로 성장하고 싶습니다.
        </p>

        <p>
          
          궁극적으로는 다양하게 배운 지식을 통해 창업을 하는 것이 궁극적인 목표입니다
          금융 계열, ai 계열에 관한 사업 아이템을 발굴하거나 혹은 이런 분야의 스타트업들을 컨설팅
          해주는 일도 해보고 싶습니다.
        </p>
      `

    }

  };


  const yearCards =
    document.querySelectorAll(
      ".future-year-card"
    );


  const goalPanel =
    document.getElementById(
      "future-goal-panel"
    );


  const goalPeriod =
    document.getElementById(
      "future-goal-period"
    );


  const goalTitle =
    document.getElementById(
      "future-goal-title"
    );


  const goalContent =
    document.getElementById(
      "future-goal-content"
    );


  const closeGoal =
    document.getElementById(
      "future-goal-close"
    );


  yearCards.forEach(function(card) {

    card.addEventListener(
      "click",
      function() {

        const selectedYear =
          card.dataset.year;

        const goal =
          futureGoals[selectedYear];

        if (!goal) {
          return;
        }


        yearCards.forEach(
          function(otherCard) {

            otherCard.classList.remove(
              "active"
            );

          }
        );


        card.classList.add(
          "active"
        );


        goalPeriod.textContent =
          goal.period;


        goalTitle.textContent =
          goal.title;


        goalContent.innerHTML =
          goal.content;


        goalPanel.classList.remove(
          "visible"
        );


        void goalPanel.offsetWidth;


        goalPanel.classList.add(
          "visible"
        );


        setTimeout(
          function() {

            goalPanel.scrollIntoView({
              behavior:
                "smooth",

              block:
                "nearest"

            });

          },
          50
        );

      }
    );

  });


  closeGoal.addEventListener(
    "click",
    function() {

      goalPanel.classList.remove(
        "visible"
      );


      yearCards.forEach(
        function(card) {

          card.classList.remove(
            "active"
          );

        }
      );

    }
  );
</script>
