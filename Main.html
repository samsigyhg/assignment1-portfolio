<script>
  function updateKoreaDateTime() {

    const now = new Date();

    const koreaDate = new Intl.DateTimeFormat("en-US", {
      timeZone: "Asia/Seoul",
      weekday: "short",
      month: "short",
      day: "numeric"
    }).format(now);

    const koreaTime = new Intl.DateTimeFormat("en-US", {
      timeZone: "Asia/Seoul",
      hour: "numeric",
      minute: "2-digit",
      hour12: true
    }).format(now);

    document.getElementById("korea-date").textContent = koreaDate;
    document.getElementById("korea-clock").textContent = koreaTime;
  }

  updateKoreaDateTime();

  setInterval(updateKoreaDateTime, 30000);
</script>
</script>
<script>
  function createHandwritingLine(element, startIndex) {

    const text = element.dataset.text;

    element.textContent = "";

    let index = startIndex;

    [...text].forEach((character) => {

      const letter = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "tspan"
      );

      letter.classList.add("hand-letter");

      if (character === " ") {
        letter.textContent = "\u00A0";
      } else {
        letter.textContent = character;
      }

      letter.style.setProperty("--letter-index", index);

      element.appendChild(letter);

      index++;
    });

    return index;
  }


  let nextLetterIndex = 0;

  nextLetterIndex = createHandwritingLine(
    document.getElementById("hand-line-1"),
    nextLetterIndex
  );


  /* 첫 번째 줄이 끝난 뒤 약간 쉬도록 간격 추가 */
  nextLetterIndex += 2;


  createHandwritingLine(
    document.getElementById("hand-line-2"),
    nextLetterIndex
  );
</script>
<script>
  const exploreStoryButton =
    document.getElementById("explore-story");

  if (exploreStoryButton) {

    exploreStoryButton.addEventListener(
      "click",
      function (event) {

        /* Ctrl 클릭 / 새 탭 열기는 방해하지 않음 */
        if (
          event.ctrlKey ||
          event.metaKey ||
          event.shiftKey ||
          event.altKey
        ) {
          return;
        }

        event.preventDefault();

        const destination =
          exploreStoryButton.href;

        document.body.classList.add(
          "is-leaving"
        );

        /*
          Story에서
          Main에서 넘어왔다는 것을 알기 위해 저장
        */
        sessionStorage.setItem(
          "fromMain",
          "true"
        );

        setTimeout(function () {

          window.location.href =
            destination;

        }, 680);

      }
    );

  }
</script>
